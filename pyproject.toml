[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packmorph-sim"
version = "0.1.0"
description = "Balanced-PKL model training and flow-feature obfuscation"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.15,<2",
  "PyYAML>=6",
  "tensorflow>=2.15,<2.21",
]

[project.optional-dependencies]
selection = ["scikit-learn>=1.3,<2"]
traces = ["scapy>=2.5,<3"]

[project.scripts]
packmorph-train = "scripts.train:main"
packmorph-obfuscate = "scripts.obfuscate:main"
packmorph-evaluate = "scripts.evaluate:main"

[tool.setuptools]
packages = ["packmorph", "scripts"]
package-dir = {packmorph = "src", scripts = "scripts"}
