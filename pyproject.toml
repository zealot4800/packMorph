[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packmorph-sim"
version = "0.1.0"
description = "Simulation-only PackMorph extension with a deep sequence classifier"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.24,<2",
  "PyYAML>=6",
  "tensorflow>=2.15,<2.21",
]

[project.scripts]
packmorph-sim = "scripts.run_study:main"

[tool.setuptools]
packages = ["packmorph", "scripts"]
package-dir = {packmorph = "src", scripts = "scripts"}
