# Train and evaluate using the six balanced PKLs.
output_dir: ..

data:
  # Dataset paths are relative to this configuration file.
  root: ../dataset
  environments: ["Non VPN", "VPN"]
  categories: ["Streaming", "VoIP", "Chat", "C2", "File Transfer"]

model:
  # Fixed input columns, in model input order, from the measured top-16 lists.
  architecture: cic_prototypical
  split_seed: 42
  device: cpu
  dropout: 0.25
  learning_rate: 0.001
  batch_size: 512
  episodes: 20000
  queries_per_episode: 512
  support_per_class: 5
  calibration_support_per_class: 100

  features:
    Non VPN:
      - pkt_len_min
      - bwd_pkt_len_min
      - fwd_pkt_len_min
      - pkt_len_std
      - bwd_pkt_len_mean
      - fwd_pkt_len_max
      - bwd_pkt_len_max
      - fwd_pkt_len_std
      - fwd_iat_std
      - bwd_iat_std
      - pkt_len_mean
      - fwd_pkt_len_mean
      - bwd_pkts_s
      - bwd_pkt_len_std
      - tot_bwd_pkts
      - down_up_ratio
    VPN:
      - pkt_len_mean
      - pkt_len_std
      - fwd_pkt_len_std
      - down_up_ratio
      - fwd_pkt_len_mean
      - bwd_pkt_len_mean
      - fwd_pkts_b_avg
      - bwd_pkt_len_std
      - bwd_pkt_len_min
      - totlen_bwd_pkts
      - fwd_iat_std
      - totlen_fwd_pkts
      - fwd_blk_rate_avg
      - tot_bwd_pkts
      - pkt_len_min
      - fwd_pkt_len_max

obfuscation:
  # Generator parameters; cached comparisons must match these settings.
  # Fresh generation additionally needs flow_context alongside each PKL's X.
  flowshift:
    # Offline aggregate adaptation: caps apply to each flow, not just totals.
    # max_fct_fraction bounds modeled timestamp span, not measured network FCT.
    # Holding bounds sample an added-span allowance; VM epochs are separate.
    strengths: [0.25, 0.5, 0.75, 1.0]
    min_displacement: 0.05
    max_extra_byte_fraction: 0.20
    max_fct_fraction: 0.15
    holding_time_ms: [250, 1000]
  # BLANKET-inspired aggregate policy: training-only fitting, validation checkpoint.
  # Accuracy-first validation selection; smaller penalties allow more overhead.
  blanket:
    iterations: 60
    population: 32
    batch_size: 256
    byte_penalty: 0.01
    duration_penalty: 0.01
  # Isolated Ditto carrier windows; continuous cover is costly per source flow.
  # Pattern and estimated virtual-carrier rate use training traffic only.
  ditto:
    pattern_length: 3
    target_utilization: 0.7
  minipatch:
    # Service-specific black-box fitting; validation selection, never test fitting.
    max_patches: 8
    max_patch_packets: 64
    iterations: 45
    max_queries: 1536
    fit_flows_per_service: 64
    success_threshold: 1.0
    dummy_bytes: 512
  minos:
    # Validation-selected service-classification adaptation of the morphing module.
    # Includes random padding; proxy encryption/header and tunnel mixing are excluded.
    front_window: 1000
    insertion_probability: 0.6
    padding_max_bytes: 0
    dummy_bytes: 64
    # Selected by capture-balanced validation accuracy over supported profiles.
    environments:
      Non VPN:
        padding_max_bytes: 32
        dummy_bytes: 1500
      VPN:
        front_window: 500
  securitas:
    # Extended aggregate action space; repeated fakes are opt-in per environment.
    iterations: 120
    population: 32
    batch_size: 64
    byte_penalty: 0.01
    similarity_reward: 0.2
    fragment_probability: 0.7
    icmp_probability: 0.48
    environments:
      Non VPN:
        iterations: 40
        population: 16
        fake_copies: 8
